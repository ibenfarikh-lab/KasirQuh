<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KasirQuh</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <div id="loginModal" class="login-overlay" style="display: none;">
    <div class="login-card">
      <h2>KasirQuh</h2>
      <p id="login-sub-title">TokoQuh</p>
      <form onsubmit="prosesLogin(event)" class="form-vertical">
        <input type="text" id="login-username" placeholder="Username" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" style="margin-top: 10px; border-radius: 8px; padding: 12px;">Masuk</button>
      </form>
    </div>
  </div>
  <div class="main-content">
    <div id="sticky-search-container" class="sticky-search-bar no-print">
      <input type="text" id="inventory-search-input" placeholder="🔍 Cari nama / kode barang..." oninput="syncAndFilterGlobal(this.value)" style="width: 100%; padding: 10px; font-size: 0.9rem;">
    </div>
    <div id="penjualan" class="tab-content active">
      <div style="display: flex; margin-bottom: 12px; width: 100%;">
        <select id="filter-category-pos" onchange="refreshData()" style="padding: 8px 10px; font-size: 0.85rem; border-radius: 8px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--input-border); width: 100%;"><option value="Semua">Semua Kategori</option></select>
      </div>
      <div class="pos-container">
        <div class="card no-print" style="margin-bottom: 0;">
          <h3 style="margin-top: 0; font-size: 0.95rem;">📦 Daftar Barang Tersedia</h3>
          <div class="product-catalog-grid" id="pos-catalog-container"></div>
          <div class="product-catalog-list" id="pos-catalog-list-container" style="display: none;"></div>
        </div>
      </div>
      <div id="cartModal" class="modal-backdrop">
        <div class="modal-content" id="printable-area">
          <div class="modal-header no-print"><h3>Keranjang Belanja</h3><button class="btn-close-modal" onclick="closeCartModal()">&times;</button></div>
          <div class="receipt-header"><h3 id="receipt-shop-name" style="margin: 0;">Nama Toko</h3><p id="receipt-shop-address" style="margin: 5px 0 0 0; font-size: 0.85rem;">Alamat Toko</p><p id="receipt-shop-phone" style="margin: 2px 0 0 0; font-size: 0.8rem;">No Telp</p></div>
          <div class="cart-table-wrapper"><table class="cart-table"><thead><tr><th style="width: 42%;">Barang</th><th style="width: 25%; text-align: center;">Qty / Satuan</th><th style="width: 23%; text-align: right;">Total</th><th class="no-print" style="width: 10%; text-align: center;">#</th></tr></thead><tbody id="cart-body"></tbody></table></div>
          <div class="summary-box">
            <div style="font-size: 1rem; font-weight: bold;">Total: Rp <span id="grand-total">0</span></div>
            <div class="no-print" style="margin-top: 8px; text-align: left;">
              <div style="display: flex; gap: 4px; margin-bottom: 4px;"><select id="pay-method" onchange="togglePayMethod()" style="width: 35%; font-size: 0.8rem; padding: 6px;"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select><input type="text" id="pay-amount" placeholder="Nominal Bayar" oninput="formatInputRupiah(this); hitungKembalian();" style="font-size: 0.8rem; padding: 6px;"></div>
              <div style="margin-top: 6px;"><input type="text" id="wa-customer-phone" placeholder="No. WhatsApp Pelanggan (Cth: 08123...)" style="font-size: 0.8rem; padding: 6px;"></div>
            </div>
            <div style="margin-top: 4px; color: #dc2626; font-size: 0.85rem; font-weight: 600;">Kembalian: Rp <span id="change-total">0</span></div>
          </div>
          <button class="btn-success no-print" onclick="selesaiTransaksi()">Selesai & Cetak Struk</button>
          <button class="btn-whatsapp no-print" onclick="bagikanStrukWhatsApp()">Bagikan Struk via WhatsApp</button>
          <button class="btn-clear-cart no-print" onclick="kosongkanKeranjang()">🗑️ Kosongkan Keranjang</button>
        </div>
      </div>
    </div>
    <div id="scannerModal" class="fab-scanner-modal"><div class="scanner-fullscreen-box"><button class="btn-close-scanner-absolute" onclick="toggleScannerPos()">&times;</button><div class="scanner-focus-frame"></div><div class="scanner-laser-line"></div><div id="scanner-box-pos" class="scanner-wrapper" style="display: block;"><div id="reader-pos"></div></div><div id="scan-notif" class="scan-status-floating"></div></div></div>
    <div id="data-barang" class="tab-content">
      <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 12px; gap: 6px; width: 100%;">
        <select id="filter-category" onchange="refreshData()" style="padding: 6px 10px; font-size: 0.78rem; border-radius: 6px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--input-border); flex: 1; min-width: 0;"><option value="Semua">Semua Kategori</option></select>
        <button onclick="eksporStokExcel()" style="background: #107c41; padding: 6px 10px; font-size: 0.78rem; border-radius: 6px; white-space: nowrap; flex-shrink: 0;">Ekspor Stok</button>
        <label style="background: #2563eb; color: white; padding: 6px 10px; font-size: 0.78rem; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0;">Impor Stok<input type="file" id="import-csv-file" accept=".csv" onchange="importStokExcel(event)" style="display: none;"></label>
      </div>
      <div id="inventory-list-wrapper" class="inventory-list"></div>
      <div id="inventory-grid-wrapper" class="inventory-grid" style="display: none;"></div>
    </div>
    <div id="belanja-stok" class="tab-content">
      <div class="card" style="margin-bottom: 12px; background: var(--table-header); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
        <div><div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">ESTIMASI TOTAL BELANJA STOK</div><div style="font-size: 1.25rem; font-weight: bold; color: #2563eb;">Rp <span id="restock-est-total">0</span></div></div>
        <div style="display: flex; gap: 6px;"><button onclick="kosongkanRestockList()" style="background: #ef4444; padding: 8px 12px; font-size: 0.75rem; border-radius: 8px;">🗑️ Kosongkan</button><button onclick="prosesBelanjaStok()" style="background: #16a34a; padding: 8px 12px; font-size: 0.75rem; border-radius: 8px; font-weight: bold;">🛒 Belanja</button></div>
      </div>
      <div id="restock-list-wrapper" class="inventory-list"></div>
      <div id="restock-grid-wrapper" class="inventory-grid" style="display: none;"></div>
    </div>
    <div class="fab-container no-print">
      <button id="fab-scan-btn" class="fab-scanner" onclick="toggleScannerPos()"></button>
      <button id="fab-filter-btn" class="fab-main" onclick="toggleStickySearchBar()"></button>
      <button id="fab-cart-btn" class="fab-main" onclick="openCartModal()"><span class="cart-badge" id="cart-count">0</span></button>
      <button id="fab-add-btn" class="fab-add" onclick="openProductModal()" style="display: none;"></button>
      <button id="fab-add-cust-btn" class="fab-add" onclick="openCustomerModal()" style="display: none;"></button>
      <button id="fab-add-catatan-btn" class="fab-add" onclick="openCatatanModal(activeSubCatatanTab)" style="display: none;"></button>
    </div>
    <div id="laporan" class="tab-content">
      <div class="sub-nav-tabs no-print"><button id="sub-btn-pelanggan" class="sub-tab-btn active" onclick="switchSubDataTab('sub-pelanggan')">👥 Data Pelanggan</button><button id="sub-btn-laporan" class="sub-tab-btn" onclick="switchSubDataTab('sub-laporan')">📋 Data Transaksi</button></div>
      <div id="sub-pelanggan" class="sub-tab-content active">
        <div class="card" style="margin-bottom: 12px; background: var(--table-header); padding: 12px 16px;"><div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">TOTAL AKUMULASI KEUANGAN</div><div style="font-size: 1.25rem; font-weight: bold; color: #2563eb;">Rp <span id="customer-total-financial">0</span></div></div>
        <div id="customer-list-wrapper" class="customer-list"></div>
      </div>
      <div id="sub-laporan" class="sub-tab-content">
        <div class="card-grid"><div class="card"><h4>TOTAL OMSET</h4><div class="val">Rp <span id="dash-omset">0</span></div></div><div class="card"><h4>KEUNTUNGAN BERSIH</h4><div class="val" style="color: #16a34a;">Rp <span id="dash-profit">0</span></div></div></div>
        <div style="margin-bottom: 12px; display: flex; gap: 6px; overflow-x: auto; margin-top: 12px;">
          <button style="background: #107c41; padding: 7px 10px; border-radius: 8px; font-size: 0.72rem;" onclick="eksporExcel()">📥 Ekspor Transaksi (csv)</button>
          <label style="background: #2563eb; color: white; padding: 7px 10px; font-size: 0.72rem; border-radius: 8px; cursor: pointer; font-weight: bold;">📤 Impor Transaksi<input type="file" id="import-report-file" accept=".csv" onchange="importLaporanExcel(event)" style="display: none;"></label>
        </div>
        <div style="width: 100%; overflow-x: auto;"><table style="width: 100%; border-collapse: collapse; background: var(--card-bg); font-size: 0.8rem;"><tbody id="report-body"></tbody></table></div>
      </div>
    </div>
    <div id="catatan" class="tab-content">
      <div class="sub-nav-tabs no-print" style="overflow-x: auto; flex-wrap: nowrap; padding-bottom: 6px; gap: 6px; align-items: center;">
        <div id="container-sub-tabs-catatan" style="display: flex; gap: 6px; flex-wrap: nowrap; align-items: center;"></div>
        <button onclick="tambahTabCatatanBaru()" style="background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer;">+</button>
      </div>
      <div id="wrapper-content-sub-catatan"></div>
    </div>
    <div id="pengaturan" class="tab-content">
      <!-- (Sisa pengaturan tetap sama) -->
    </div>
  </div>
  <div class="permanent-bottom-bar no-print">
    <h2 id="permanent-title" style="font-size: 1.05rem; margin: 0; font-weight: 700;">Halaman Kasir</h2>
    <div class="bottom-right-menu-container"><button class="btn-bar-menu" onclick="toggleFloatingMenu()"><span class="burger-line"></span><span class="burger-line"></span><span class="burger-line"></span></button></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
