    <!-- 4. HALAMAN LAPORAN / DATA -->
    <div id="laporan" class="tab-content">
      <div class="sub-nav-tabs no-print">
        <button id="sub-btn-pelanggan" class="sub-tab-btn active" onclick="switchSubDataTab('sub-pelanggan')">👥 Data Pelanggan</button>
        <button id="sub-btn-laporan" class="sub-tab-btn" onclick="switchSubDataTab('sub-laporan')">📋 Data Transaksi</button>
      </div>

      <div id="sub-pelanggan" class="sub-tab-content active">
        <div class="card" style="margin-bottom: 12px; background: var(--table-header); padding: 12px 16px;">
          <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">TOTAL AKUMULASI KEUANGAN / CATATAN PELANGGAN</div>
          <div style="font-size: 1.25rem; font-weight: bold; color: #2563eb;">Rp <span id="customer-total-financial">0</span></div>
        </div>

        <div style="margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; align-items: center;">
          <button onclick="eksporPelangganExcel()" style="background: #107c41; padding: 7px 10px; border-radius: 8px; font-size: 0.72rem; white-space: nowrap; flex-shrink: 0;">Ekspor Pelanggan</button>
          <label style="background: #2563eb; color: white; padding: 7px 10px; font-size: 0.72rem; border-radius: 8px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0;">
            Impor Pelanggan
            <input type="file" id="import-cust-file" accept=".csv" onchange="importPelangganExcel(event)" style="display: none;">
          </label>
        </div>
        <div id="customer-list-wrapper" class="customer-list"></div>
      </div>

      <div id="sub-laporan" class="sub-tab-content">
        <div class="card-grid">
          <div class="card">
            <h4>TOTAL OMSET</h4>
            <div class="val">Rp <span id="dash-omset">0</span></div>
          </div>
          <div class="card">
            <h4>KEUNTUNGAN BERSIH</h4>
            <div class="val" style="color: #16a34a;">Rp <span id="dash-profit">0</span></div>
          </div>
          <div class="card">
            <h4>TRANSAKSI SUKSES</h4>
            <div class="val" id="dash-trans">0</div>
          </div>
          <div class="card">
            <h4>TOTAL ITEM BARANG</h4>
            <div class="val" id="dash-items">0</div>
          </div>
        </div>

        <div style="margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; margin-top: 12px; align-items: center;">
          <button style="background: #107c41; padding: 7px 10px; border-radius: 8px; font-size: 0.72rem; white-space: nowrap; flex-shrink: 0;" onclick="eksporExcel()">📥 Ekspor Transaksi (csv)</button>
          <label style="background: #2563eb; color: white; padding: 7px 10px; font-size: 0.72rem; border-radius: 8px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0;">
            📤 Impor Transaksi
            <input type="file" id="import-report-file" accept=".csv" onchange="importLaporanExcel(event)" style="display: none;">
          </label>
        </div>
        <div style="width: 100%; overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; background: var(--card-bg); font-size: 0.8rem; color: var(--text-color);">
            <thead>
              <tr style="background: var(--table-header); text-align: left;">
                <th style="padding: 8px;">Waktu</th>
                <th style="padding: 8px;">Metode</th>
                <th style="padding: 8px;">Qty/Satuan</th>
                <th style="padding: 8px;">Omset</th>
                <th style="padding: 8px;">Untung</th>
              </tr>
            </thead>
            <tbody id="report-body"></tbody>
          </table>
        </div>
      </div>
    </div>
