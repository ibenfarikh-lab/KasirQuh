<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir & Toko</title>
  <style>
    :root {
      --border-color: #e2e8f0;
      --text-muted: #64748b;
      --bg-main: #f8fafc;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
    }
    
    body {
      font-family: sans-serif;
      background-color: var(--bg-main);
      margin: 0;
      padding: 0;
      color: #1e293b;
    }

    .tab-content {
      display: none;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    .sub-tab-content {
      display: none;
    }

    .sub-tab-content.active {
      display: block;
    }

    .permanent-header {
      background: #ffffff;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .permanent-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .pagination-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pagination-wrapper button {
      padding: 4px 10px;
      background: #e2e8f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #fab-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    #fab-container button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 16px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Struktur HTML Aplikasi -->
  <div id="app-container">
    <!-- Navbar / Header -->
    <header class="permanent-header">
      <h2 id="permanent-title">Kasir</h2>
      <div id="pos-pagination-wrapper" class="pagination-wrapper">
        <button id="pos-prev-btn" onclick="changePosPage(-1)">‹</button>
        <span id="pos-page-info">1/1</span>
        <button id="pos-next-btn" onclick="changePosPage(1)">›</button>
      </div>
      <div id="stok-pagination-wrapper" class="pagination-wrapper" style="display:none;">
        <button id="stok-prev-btn" onclick="changeStokPage(-1)">‹</button>
        <span id="stok-page-info">1/1</span>
        <button id="stok-next-btn" onclick="changeStokPage(1)">›</button>
      </div>
    </header>

    <!-- Konten Utama / Tab -->
    <main>
      <div id="penjualan" class="tab-content active">
        <div id="pos-catalog-container"></div>
        <div id="pos-catalog-list-container"></div>
      </div>

      <div id="data-barang" class="tab-content">
        <div id="inventory-list-wrapper"></div>
        <div id="inventory-grid-wrapper"></div>
      </div>

      <div id="belanja-stok" class="tab-content">
        <div id="restock-list-wrapper"></div>
        <div id="restock-grid-wrapper"></div>
        <div style="margin-top: 12px; font-weight: bold;">Total Est: Rp <span id="restock-est-total">0</span></div>
      </div>

      <div id="laporan" class="tab-content">
        <div class="sub-tab-content active" id="sub-laporan">
          <table>
            <tbody id="report-body"></tbody>
          </table>
        </div>
        <div class="sub-tab-content" id="sub-pelanggan">
          <div id="customer-list-wrapper"></div>
          <div style="margin-top: 12px; font-weight: bold;">Total Finansial Pelanggan: Rp <span id="customer-total-financial">0</span></div>
        </div>
      </div>

      <div id="pengaturan" class="tab-content">
        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px;">
          <input type="text" id="setting-user" placeholder="Username">
          <input type="password" id="setting-pass" placeholder="Password">
          <input type="text" id="setting-shop-name" placeholder="Nama Toko">
          <input type="text" id="setting-shop-address" placeholder="Alamat Toko">
          <input type="text" id="setting-shop-phone" placeholder="No Telepon">
          <input type="number" id="setting-cooldown" placeholder="Cooldown">
          <select id="setting-view-mode"><option value="grid">Grid</option><option value="list">List</option></select>
        </div>
      </div>
    </main>

    <!-- Elemen Data Tersembunyi & Notifikasi -->
    <div id="scan-notif" style="display:none;"></div>
    <input type="hidden" id="db-selected-online-img">
    <input type="hidden" id="db-name">
    <input type="hidden" id="db-code">
    <input type="hidden" id="db-category">
    <input type="hidden" id="db-unit">
    <input type="hidden" id="db-isi-rtg">
    <input type="hidden" id="db-stock">
    <input type="hidden" id="db-cost">
    <input type="hidden" id="db-price">
    <input type="hidden" id="edit-restock-id">
    <input type="hidden" id="cust-id">
    <input type="hidden" id="cust-name">
    <input type="hidden" id="cust-phone">
    <input type="hidden" id="cust-address">
    <input type="hidden" id="bk-cust-id">
    <input type="hidden" id="bk-note-id">
    <input type="hidden" id="bk-datetime">
    <input type="hidden" id="bk-type">
    <input type="hidden" id="bk-amount">
    <input type="hidden" id="bk-desc">
    <input type="hidden" id="pay-amount">
    <select id="pay-method" style="display:none;"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select>
    <input type="text" id="wa-customer-phone" style="display:none;">

    <!-- Tombol Navigasi / FAB -->
    <div id="fab-container">
      <button id="fab-cart-btn">🛒</button>
      <button id="fab-scan-btn">📷</button>
      <button id="fab-filter-btn">🔍</button>
      <button id="fab-add-btn" style="display:none;">+</button>
      <button id="fab-add-cust-btn" style="display:none;">+ Cust</button>
    </div>
  </div>

  <!-- Skrip JavaScript Utama -->
  <script>
    // Logika dasar navigasi tab & fungsi bantu sementara
    function changePosPage(val) { console.log("POS Page:", val); }
    function changeStokPage(val) { console.log("Stok Page:", val); }
    
    // Tempatkan seluruh kode script.js Anda yang lain di bawah baris ini jika diperlukan
    console.log("Aplikasi Kasir Siap");
  </script>
</body>
</html>
