<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KasirQuh</title>
  <meta name="theme-color" content="#06132d">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html { min-height: 100%; background: #06132d; }
    body { margin: 0; min-height: 100dvh; height: 100dvh; overflow: hidden; background: #06132d; }
  </style>

<style id="kasirquh-gateway-portrait-viewport-v1">
@media (min-width: 768px) {
  html { background: #05080f !important; min-height: 100% !important; }
  body {
    width: 430px !important; min-width: 430px !important; max-width: 430px !important;
    height: 100vh !important; min-height: 100vh !important; max-height: 100vh !important;
    margin: 0 auto !important; overflow: hidden !important; position: relative !important;
    box-sizing: border-box !important;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 0 60px rgba(0,0,0,.55) !important;
  }
  #kasirquhPwaOpening, #kasirquhVisual4Welcome {
    width: 430px !important; max-width: 430px !important; min-width: 430px !important;
    height: 100vh !important; min-height: 100vh !important;
    left: 50% !important; right: auto !important; top: 0 !important; bottom: auto !important;
    inset-inline-start: 50% !important; inset-inline-end: auto !important;
    transform: translateX(-50%) !important; box-sizing: border-box !important;
  }
  #kasirquhPwaOpening .kpo-grid, #kasirquhPwaOpening .kpo-glow,
  #kasirquhVisual4Welcome .kv4-slide-image, #kasirquhVisual4Welcome .kv4-dim {
    max-width: none !important;
  }
}
</style>
</head>
<body>
<!-- KASIRQUH FUTURISTIC PWA OPENING -->
<style>
#kasirquhPwaOpening{
  position:fixed; inset:0; z-index:2147483647;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:#06132d;
  opacity:1; visibility:visible;
  transition:opacity .65s ease, visibility .65s ease;
}
#kasirquhPwaOpening.hide{opacity:0;visibility:hidden;pointer-events:none}
#kasirquhPwaOpening .kpo-grid{
  position:absolute; inset:-20%; opacity:.22;
  background-image:linear-gradient(rgba(80,170,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(80,170,255,.12) 1px,transparent 1px);
  background-size:42px 42px; transform:perspective(500px) rotateX(58deg) scale(1.35);
  transform-origin:center bottom; animation:kpoGrid 5s linear infinite;
}
#kasirquhPwaOpening .kpo-glow{
  position:absolute; width:78vmax; height:78vmax; border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.38) 0%,rgba(14,165,233,.17) 28%,rgba(37,99,235,.06) 48%,transparent 70%);
  filter:blur(10px); animation:kpoPulse 2.2s ease-in-out infinite;
}
#kasirquhPwaOpening .kpo-orbit{
  position:absolute; width:230px; height:230px; border-radius:50%;
  border:1px solid rgba(125,211,252,.22); box-shadow:0 0 35px rgba(37,99,235,.2),inset 0 0 35px rgba(14,165,233,.12);
  animation:kpoOrbit 3.8s linear infinite;
}
#kasirquhPwaOpening .kpo-orbit:before,
#kasirquhPwaOpening .kpo-orbit:after{
  content:""; position:absolute; inset:17px; border-radius:50%; border:1px solid rgba(96,165,250,.13);
}
#kasirquhPwaOpening .kpo-orbit:after{inset:-17px;border-color:rgba(56,189,248,.10)}
#kasirquhPwaOpening .kpo-logo{
  position:relative; width:min(34vw,180px); height:min(34vw,180px); object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(59,130,246,.75)) drop-shadow(0 0 30px rgba(14,165,233,.48));
  animation:kpoLogo 1.35s cubic-bezier(.2,.8,.2,1) both;
}
#kasirquhPwaOpening .kpo-shine{
  position:absolute; width:230%; height:28%; left:-65%; top:36%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(-18deg); filter:blur(5px); animation:kpoShine 1.35s .35s ease-out both;
}
#kasirquhPwaOpening .kpo-text{
  position:absolute; bottom:11%; left:0; right:0; text-align:center;
  color:rgba(219,234,254,.92); font:700 12px/1.2 system-ui,sans-serif; letter-spacing:4px;
  text-transform:uppercase; opacity:0; animation:kpoText .7s .55s ease-out forwards;
}
@keyframes kpoLogo{0%{transform:scale(.52);opacity:0}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes kpoPulse{0%,100%{transform:scale(.92);opacity:.72}50%{transform:scale(1.08);opacity:1}}
@keyframes kpoOrbit{to{transform:rotate(360deg)}}
@keyframes kpoShine{0%{transform:translateX(-70%) rotate(-18deg);opacity:0}25%{opacity:1}100%{transform:translateX(70%) rotate(-18deg);opacity:0}}
@keyframes kpoGrid{to{background-position:0 42px,42px 0}}
@keyframes kpoText{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#kasirquhPwaOpening *{animation:none!important}}
</style>
<div id="kasirquhPwaOpening" aria-hidden="true">
  <div class="kpo-grid"></div>
  <div class="kpo-glow"></div>
  <div class="kpo-orbit"></div>
  <div style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:min(34vw,180px);height:min(34vw,180px);border-radius:28%;">
    <img class="kpo-logo" src="icon-512.png" alt="KasirQuh">
    <div class="kpo-shine"></div>
  </div>
  <div class="kpo-text">KasirQuh</div>
</div>
<script>
(function(){
  const o=document.getElementById('kasirquhPwaOpening');
  if(!o)return;
  const close=()=>o.classList.add('hide');
  window.addEventListener('load',()=>setTimeout(close,1050),{once:true});
  setTimeout(close,1800);
})();
</script>


<!-- KASIRQUH SLIDE 1-2-3 WELCOME PATCH -->
<style id="kasirquh-slide123-patch">
  #kasirquhVisual4Welcome {
    position: fixed;
    inset: 0;
    z-index: 99999;
    overflow: hidden;
    background: #000;
    opacity: 1;
    visibility: visible;
    transition: opacity .72s ease, visibility .72s ease;
  }
  #kasirquhVisual4Welcome.kv4-leaving {
    opacity: 0;
    visibility: hidden;
  }
  #kasirquhVisual4Welcome .kv4-slide-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 1;
    transform: scale(1);
    transition: opacity .55s ease, transform .82s cubic-bezier(.2,.75,.2,1), filter .72s ease;
  }
  #kasirquhVisual4Welcome.kv4-focus-customer .kv4-slide-image,
  #kasirquhVisual4Welcome.kv4-focus-admin .kv4-slide-image {
    transform: scale(1.12) translateY(-2%);
    filter: brightness(.78) saturate(1.08) blur(.7px);
  }
  #kasirquhVisual4Welcome .kv4-dim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 65%, rgba(255,255,255,.04), rgba(0,0,0,.18) 70%, rgba(0,0,0,.28));
    opacity: .28;
    transition: opacity .7s ease;
  }
  #kasirquhVisual4Welcome.kv4-focus-customer .kv4-dim,
  #kasirquhVisual4Welcome.kv4-focus-admin .kv4-dim { opacity: .72; }
  #kasirquhVisual4Welcome .kv4-button-glow {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    box-sizing: border-box;
    border: 1.5px solid rgba(255,255,255,.86);
    border-radius: 16px;
    background: rgba(255,255,255,.012);
    opacity: 0;
    box-shadow: 0 0 4px rgba(255,255,255,.58), 0 0 11px rgba(255,255,255,.30), inset 0 0 6px rgba(255,255,255,.12);
  }
  #kv4CustomerGlow, #kv4AdminGlow {
    left: 0; top: 0; width: 0; height: 0;
  }
  #kasirquhVisual4Welcome .kv4-button-glow.kv4-glow-active {
    animation: kv4GlowReveal .88s ease-in-out forwards;
  }
  #kasirquhVisual4Welcome .kv4-button-glow.kv4-glow-pressed {
    animation: kv4GlowPressed .34s ease-out forwards;
  }
  @keyframes kv4GlowReveal {
    0% { opacity: 0; transform: scale(.985); filter: brightness(.96); }
    20% { opacity: .78; transform: scale(1); filter: brightness(1.18); }
    58% { opacity: .52; transform: scale(1.008); filter: brightness(1.08); }
    100% { opacity: 0; transform: scale(1.018); filter: brightness(1); }
  }
  @keyframes kv4GlowPressed {
    0% { opacity: .35; transform: scale(1); }
    45% { opacity: 1; transform: scale(1.035); filter: brightness(1.55); box-shadow: 0 0 8px rgba(255,255,255,.95), 0 0 24px rgba(255,255,255,.7), inset 0 0 12px rgba(255,255,255,.28); }
    100% { opacity: 0; transform: scale(1.055); }
  }
  @media (max-width: 480px) {
    #kasirquhVisual4Welcome .kv4-button-glow { border-radius: 16px; border-width: 1.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #kasirquhVisual4Welcome .kv4-button-glow { animation-duration: .2s !important; }
  }

  #kasirquhVisual4Welcome .kv4-hotspot {
    position: absolute;
    z-index: 3;
    padding: 0;
    margin: 0;
    border: 0;
    outline: 0;
    background: transparent !important;
    background-image: none !important;
    color: transparent !important;
    box-shadow: none !important;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    -webkit-appearance: none;
  }
  #kv4CustomerHotspot, #kv4AdminHotspot {
    left: 0; top: 0; width: 0; height: 0;
  }
  @media (max-width: 480px) { }
  @media (prefers-reduced-motion: reduce) {
    #kasirquhVisual4Welcome,
    #kasirquhVisual4Welcome .kv4-slide-image,
    #kasirquhVisual4Welcome .kv4-dim { transition-duration: .2s; }
  }
</style>

<div id="kasirquhVisual4Welcome" aria-label="Welcome screen">
  <img id="kv4SlideImage" class="kv4-slide-image" src="./slide1.png" alt="" aria-hidden="true">
  <div class="kv4-dim" aria-hidden="true"></div>
  <div id="kv4CustomerGlow" class="kv4-button-glow kv4-glow-customer" aria-hidden="true"></div>
  <div id="kv4AdminGlow" class="kv4-button-glow kv4-glow-admin" aria-hidden="true"></div>
  <button id="kv4CustomerHotspot" class="kv4-hotspot" type="button" aria-label="Mulai Belanja"></button>
  <button id="kv4AdminHotspot" class="kv4-hotspot" type="button" aria-label="Admin"></button>
</div>

<script id="kasirquh-slide123-script">
(function () {
  function initSlide123Welcome() {
    const existingWelcome = document.getElementById('kasirquhVisual4Welcome');
    const login = document.getElementById('loginModal');

    // IMPORTANT: wait for Firebase Auth to resolve persistence before deciding whether
    // Welcome should exist. Reading auth.currentUser synchronously can be null for a
    // short time during startup even when a valid session is being restored.
    if (window.firebase && firebase.auth) {
      let settled = false;
      const unsubscribe = firebase.auth().onAuthStateChanged(function(user) {
        if (settled) return;
        settled = true;
        try { unsubscribe(); } catch (_) {}
        if (user) {
          if (existingWelcome) existingWelcome.remove();
          if (login) login.style.display = 'none';
          return;
        }
        initSlide123WelcomeBody();
      });
      return;
    }
    initSlide123WelcomeBody();
  }

  function initSlide123WelcomeBody() {
    const welcome = document.getElementById('kasirquhVisual4Welcome');
    const image = document.getElementById('kv4SlideImage');
    const customer = document.getElementById('kv4CustomerHotspot');
    const admin = document.getElementById('kv4AdminHotspot');
    const customerGlow = document.getElementById('kv4CustomerGlow');
    const adminGlow = document.getElementById('kv4AdminGlow');
    if (!welcome || !image || !customer || !admin) return;

    const slides = ['./slide1.png', './slide2.png', './slide3.png'];
    let current = 0;
    let leaving = false;
    let slideTimer = null;

    // Preload every slide before it is ever shown. This prevents a black flash
    // when the image source changes during the transition.
    const preloadedSlides = slides.map(function (src) {
      const img = new Image();
      img.src = src;
      return img;
    });

    // Position hotspots/glows against the actual rendered image, so object-fit:cover
    // and different screen aspect ratios cannot shift them away from the photo buttons.
    const customerBox = { x: 40 / 688, y: 1270 / 1536, w: 390 / 688, h: 100 / 1536 };
    const adminBox = { x: 442 / 688, y: 1270 / 1536, w: 205 / 688, h: 100 / 1536 };

    function syncSlideButtonPositions() {
      const imgRect = image.getBoundingClientRect();
      const parentRect = welcome.getBoundingClientRect();
      const parentW = parentRect.width;
      const parentH = parentRect.height;
      const scale = Math.max(parentW / image.naturalWidth, parentH / image.naturalHeight);
      const renderedW = image.naturalWidth * scale;
      const renderedH = image.naturalHeight * scale;
      const cropX = (renderedW - parentW) / 2;
      const cropY = (renderedH - parentH) / 2;
      function apply(box, hotspot, glow) {
        if (!hotspot) return;
        const left = box.x * image.naturalWidth * scale - cropX;
        const top = box.y * image.naturalHeight * scale - cropY;
        const width = box.w * image.naturalWidth * scale;
        const height = box.h * image.naturalHeight * scale;
        [hotspot, glow].forEach(function(el) {
          if (!el) return;
          el.style.left = left + 'px';
          el.style.top = top + 'px';
          el.style.width = width + 'px';
          el.style.height = height + 'px';
        });
      }
      if (image.naturalWidth && image.naturalHeight) {
        apply(customerBox, customer, customerGlow);
        apply(adminBox, admin, adminGlow);
      }
    }

    image.addEventListener('load', syncSlideButtonPositions);
    window.addEventListener('resize', syncSlideButtonPositions);
    requestAnimationFrame(syncSlideButtonPositions);

    function pulseButtonGlows() {
      [customerGlow, adminGlow].forEach(function (el) {
        if (!el) return;
        el.classList.remove('kv4-glow-active', 'kv4-glow-pressed');
        void el.offsetWidth;
        el.classList.add('kv4-glow-active');
      });
    }

    function showNextSlide() {
      if (leaving) return;
      const next = (current + 1) % slides.length;
      const nextImage = preloadedSlides[next];

      function commitNextSlide() {
        if (leaving) return;
        current = next;
        // The next image is already loaded, so swap it without ever fading
        // through the black background. The existing glow timing is preserved.
        image.src = slides[current];
        syncSlideButtonPositions();
        pulseButtonGlows();
      }

      if (nextImage && nextImage.complete) {
        commitNextSlide();
      } else if (nextImage) {
        nextImage.addEventListener('load', commitNextSlide, { once: true });
      } else {
        commitNextSlide();
      }
    }

    pulseButtonGlows();
    slideTimer = setInterval(showNextSlide, 4500);

    function leave(mode, destination) {
      if (leaving) return;
      leaving = true;
      if (slideTimer) clearInterval(slideTimer);
      welcome.classList.add(mode);
      setTimeout(function () {
        if (destination) {
          window.location.href = destination;
          return;
        }
        welcome.classList.add('kv4-leaving');
        setTimeout(function () { welcome.remove(); }, 760);
      }, 430);
    }

    customer.addEventListener('click', function () {
      if (customerGlow) { customerGlow.classList.remove('kv4-glow-active'); void customerGlow.offsetWidth; customerGlow.classList.add('kv4-glow-pressed'); }
      leave('kv4-focus-customer', './pelanggan/index.html');
    });

    admin.addEventListener('click', function () {
      if (adminGlow) { adminGlow.classList.remove('kv4-glow-active'); void adminGlow.offsetWidth; adminGlow.classList.add('kv4-glow-pressed'); }
      leave('kv4-focus-admin', './admin/index.html');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSlide123Welcome);
  } else {
    initSlide123Welcome();
  }
})();
</script>
</body>
</html>
