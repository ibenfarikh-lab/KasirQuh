<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir & Toko</title>
  <!-- Hubungkan file CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Struktur HTML Aplikasi (Sesuaikan dengan elemen UI utama Anda) -->
  <div id="app-container">
    <!-- Navbar / Header -->
    <header class="permanent-header">
      <h2 id="permanent-title">Kasir</h2>
      <div id="pos-pagination-wrapper" class="pagination-wrapper">
        <button id="pos-prev-btn" onclick="changePosPage(-1)">‹</button>
        <span id="pos-page-info">1/1</span>
        <button id="pos-next-btn" onclick="changePosPage(1)">›</button>
      </div>
      <div id="stok-pagination-wrapper" class="pagination-wrapper">
        <button id="stok-prev-btn" onclick="changeStokPage(-1)">‹</button>
        <span id="stok-page-info">1/1</span>
        <button id="stok-next-btn" onclick="changeStokPage(1)">›</button>
      </div>
    </header>

    <!-- Konten Utama / Tab -->
    <main>
      <!-- Contoh Tab Penjualan / Kasir -->
      <div id="penjualan" class="tab-content active">
        <div id="pos-catalog-container"></div>
        <div id="pos-catalog-list-container"></div>
      </div>

      <!-- Contoh Tab Data Barang -->
      <div id="data-barang" class="tab-content">
        <div id="inventory-list-wrapper"></div>
        <div id="inventory-grid-wrapper"></div>
      </div>

      <!-- Contoh Tab Belanja Stok -->
      <div id="belanja-stok" class="tab-content">
        <div id="restock-list-wrapper"></div>
        <div id="restock-grid-wrapper"></div>
        <div>Total Est: Rp <span id="restock-est-total">0</span></div>
      </div>

      <!-- Contoh Tab Laporan -->
      <div id="laporan" class="tab-content">
        <div class="sub-tab-content active" id="sub-laporan">
          <table>
            <tbody id="report-body"></tbody>
          </table>
        </div>
        <div class="sub-tab-content" id="sub-pelanggan">
          <div id="customer-list-wrapper"></div>
          <div>Total Finansial Pelanggan: Rp <span id="customer-total-financial">0</span></div>
        </div>
      </div>

      <!-- Tab Pengaturan -->
      <div id="pengaturan" class="tab-content">
        <input type="text" id="setting-user">
        <input type="password" id="setting-pass">
        <input type="text" id="setting-shop-name">
        <input type="text" id="setting-shop-address">
        <input type="text" id="setting-shop-phone">
        <input type="number" id="setting-cooldown">
        <select id="setting-view-mode"><option value="grid">Grid</option><option value="list">List</option></select>
      </div>
    </main>

    <!-- Notifikasi & Elemen Tersembunyi untuk Data -->
    <div id="scan-notif" style="display:none;"></div>
    <input type="hidden" id="db-selected-online-img">
    <input type="hidden" id="db-name">
    <input type="hidden" id="db-code">
    <input type="hidden" id="db-category">
    <input type="hidden" id="db-unit">
    <input type="hidden" id="db-isi-rtg">
    <input type="hidden" id="db-stock">
    <input type="hidden" id="db-cost">
    <input type="hidden" id="db-price">
    <input type="hidden" id="edit-restock-id">
    <input type="hidden" id="cust-id">
    <input type="hidden" id="cust-name">
    <input type="hidden" id="cust-phone">
    <input type="hidden" id="cust-address">
    <input type="hidden" id="bk-cust-id">
    <input type="hidden" id="bk-note-id">
    <input type="hidden" id="bk-datetime">
    <input type="hidden" id="bk-type">
    <input type="hidden" id="bk-amount">
    <input type="hidden" id="bk-desc">
    <input type="hidden" id="pay-amount">
    <select id="pay-method"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select>
    <input type="text" id="wa-customer-phone">

    <!-- Tombol Navigasi / FAB -->
    <div id="fab-container">
      <button id="fab-cart-btn">🛒</button>
      <button id="fab-scan-btn">📷</button>
      <button id="fab-filter-btn">🔍</button>
      <button id="fab-add-btn" style="display:none;">+</button>
      <button id="fab-add-cust-btn" style="display:none;">+ Cust</button>
    </div>
  </div>

  <!-- Hubungkan file JavaScript -->
  <script src="script.js"></script>
</body>
</html>
