<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KasirQuh</title>
  <meta name="theme-color" content="#06132d">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  



  <link rel="stylesheet" href="./gateway/index.css">
</head>
<body>
<!-- KASIRQUH FUTURISTIC PWA OPENING -->

<div id="kasirquhPwaOpening" aria-hidden="true">
  <div class="kpo-grid"></div>
  <div class="kpo-glow"></div>
  <div class="kpo-orbit"></div>
  <div style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:min(34vw,180px);height:min(34vw,180px);border-radius:28%;">
    <img class="kpo-logo" src="icon-512.png" alt="KasirQuh">
    <div class="kpo-shine"></div>
  </div>
  <div class="kpo-text">KasirQuh</div>
</div>



<!-- KASIRQUH SLIDE 1-2-3 WELCOME PATCH -->


<!-- KASIRQUH GATEWAY PWA INSTALL FAB -->

<button id="gateway-pwa-install" type="button" aria-label="Install Aplikasi KasirQuh" title="Install Aplikasi KasirQuh">
  <span id="gateway-pwa-install-icon" aria-hidden="true">📲</span>
  <span>Install</span>
</button>


<div id="kasirquhVisual4Welcome" aria-label="Welcome screen">
  <img id="kv4SlideImage" class="kv4-slide-image" src="./assets/gateway/slide1.png" alt="" aria-hidden="true">
  <div class="kv4-dim" aria-hidden="true"></div>
  <div id="kv4CustomerGlow" class="kv4-button-glow kv4-glow-customer" aria-hidden="true"></div>
  <div id="kv4AdminGlow" class="kv4-button-glow kv4-glow-admin" aria-hidden="true"></div>
  <div id="kv4CustomerSwipe" class="kv4-customer-swipe" aria-hidden="true"><span class="kv4-swipe-handle">→</span></div>
  <button id="kv4CustomerHotspot" class="kv4-hotspot" type="button" aria-label="Geser untuk Mulai Belanja"></button>
  <button id="kv4AdminHotspot" class="kv4-hotspot" type="button" aria-label="Admin"></button>
</div>


<!-- INDEX AI ASSISTANT FAB: copied customer style, draggable -->

<button id="index-ai-fab" type="button" aria-label="Asisten AI" title="Asisten AI"><img src="./assets/gateway/robot-head-ai.png" alt="Kepala robot Asisten AI"></button>
<div id="index-ai-modal" aria-hidden="true">
  <div id="index-ai-panel">
    <div id="index-ai-head">
      <div style="display:flex;align-items:center;gap:6px"><strong style="font-size:.9rem">😀 Asisten Belanja AI</strong><button id="index-ai-sound" type="button">🔊 Suara: ON</button></div>
      <button id="index-ai-close" type="button">&times;</button>
    </div>
    <div id="index-ai-messages"><div style="align-self:flex-start;background:#fff;border:1px solid #e5e7eb;color:#111827;padding:6px 10px;border-radius:8px;max-width:80%">HALOOOO BESTIE! Aku Asisten AI Warunge Mimi. Mau ngobrol atau tanya-tanya dulu?</div></div>
    <div id="index-ai-input-row"><input id="index-ai-input" type="text" placeholder="Tanya atau ngobrol..." autocomplete="off" aria-label="Pesan untuk Asisten AI"><button id="index-ai-mic" type="button" title="Ngomong pakai suara">🎤</button><button id="index-ai-send" type="button">Kirim</button></div>
  </div>
</div>



  <script src="./gateway/index.js"></script>
</body>
</html>
